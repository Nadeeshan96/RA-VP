name: ravp
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn>=1.3
  - shapely>=2.0
  - tqdm
  - pip
  - pip:
      - torch>=2.1
      - xgboost>=2.0
      - gdown               # download the asset bundle from Google Drive
      - llvmlite            # pulls a single OpenMP runtime; avoids libomp clashes
